# Per-skill EDD eval suite for statusrpt-guard (adversarial review of a compiled report).
#
# The guard reads a COMPILED report plus the same pre-fetched source files the compile
# step used as ground truth, and emits a verdict (PASS / FAIL) with itemized findings.
# A FAIL must name the specific defect and the criterion it violates.
#
# Eval design = DEFECT INJECTION: one clean report the guard must PASS, and five
# single-defect corruptions the guard must FAIL while naming the planted defect. A guard
# that cannot catch a planted defect is worthless, so "catch the known defect" is the
# substantive, repeatable check (Stage 3 §2). Each guard criterion mirrors a compile
# criterion so coverage is symmetric.
#
# skillFile/fixturesDir are overridden per test (the provider configs default skillFile to
# github-issue-creator). Written RED: SKILL.md does not exist yet.

# ─── Criterion 1: clean report → PASS ───
- description: "G1 clean — a correct compiled report yields verdict PASS, no defects"
  metadata:
    skill: statusrpt-guard
    criterion: clean-pass
  vars:
    skillFile: ../../skills/statusrpt-guard/SKILL.md
    fixturesDir: skills/statusrpt-guard/fixtures
    request: >
      Adversarially review the compiled report {{fixturesDir}}/report-clean.md against the
      source files in {{fixturesDir}} (gh-api-responses.json, confluence-tracker.html,
      taskei-sprint.json, chorus-narratives.json). Output your verdict and any findings.
  assert:
    - type: llm-rubric
      value: >
        The report-clean.md is a correct reconciliation of the sources. PASS only if the
        guard's verdict is PASS (it finds no genuine defects). If the guard reports FAIL or
        invents defects that are not actually present, this test FAILS.
    - type: contains
      value: "PASS"

# ─── Criterion 2: rejected PR left in Submitted (wrong table) → FAIL ───
- description: "G2 wrong-table — catch a maintainer-rejected PR left in Submitted instead of Dropped"
  metadata:
    skill: statusrpt-guard
    criterion: catch-wrong-table
  vars:
    skillFile: ../../skills/statusrpt-guard/SKILL.md
    fixturesDir: skills/statusrpt-guard/fixtures
    request: >
      Adversarially review {{fixturesDir}}/report-defect-wrong-table.md against the source
      files in {{fixturesDir}}. Output your verdict and any findings.
  assert:
    - type: llm-rubric
      value: >
        gh-api-responses.json shows sample-session#50 was closed-rejected by maintainers, so
        it must be in Dropped — but this report leaves "Sample Session Store" in the
        Submitted table. PASS only if the guard's verdict is FAIL AND a finding identifies
        that Sample Session Store (PR 50) is in the wrong table (should be Dropped, not
        Submitted). FAIL if the guard passes the report or misses this defect.
    - type: contains
      value: "FAIL"

# ─── Criterion 3: unconfirmed release promotion (bad release) → FAIL ───
- description: "G3 bad-release — catch a Merged→Completed promotion whose release does not name the PR"
  metadata:
    skill: statusrpt-guard
    criterion: catch-bad-release
  vars:
    skillFile: ../../skills/statusrpt-guard/SKILL.md
    fixturesDir: skills/statusrpt-guard/fixtures
    request: >
      Adversarially review {{fixturesDir}}/report-defect-bad-release.md against the source
      files in {{fixturesDir}}. Output your verdict and any findings.
  assert:
    - type: llm-rubric
      value: >
        This report promotes "Sample Aggregate Func" (PR 20) to Completed citing v3.0.0, but
        gh-api-responses.json shows the v3.0.0 release body does NOT reference #20, so it
        should have stayed in Merged and been flagged. PASS only if the guard's verdict is
        FAIL AND a finding identifies that PR 20 was promoted to Completed without a release
        that references it. FAIL if the guard misses this.
    - type: contains
      value: "FAIL"

# ─── Criterion 4: stale prior-week bullet survived → FAIL ───
- description: "G4 stale-bullet — catch a prior-week progress bullet that survived regeneration"
  metadata:
    skill: statusrpt-guard
    criterion: catch-stale-bullet
  vars:
    skillFile: ../../skills/statusrpt-guard/SKILL.md
    fixturesDir: skills/statusrpt-guard/fixtures
    request: >
      Adversarially review {{fixturesDir}}/report-defect-stale-bullet.md against the source
      files in {{fixturesDir}}. Output your verdict and any findings.
  assert:
    - type: llm-rubric
      value: >
        This report's This Week's Progress still contains the prior week's bullet
        "Demo CLI moved to In Review", which should have been regenerated away. PASS only if
        the guard's verdict is FAIL AND a finding identifies a stale/carried-over prior-week
        bullet in This Week's Progress. FAIL if the guard misses it.
    - type: contains
      value: "FAIL"

# ─── Criterion 5: prior-week-merged infra row not removed → FAIL ───
- description: "G5 infra-notremoved — catch a prior-week-merged Infrastructure row that was not cleaned up"
  metadata:
    skill: statusrpt-guard
    criterion: catch-infra-notremoved
  vars:
    skillFile: ../../skills/statusrpt-guard/SKILL.md
    fixturesDir: skills/statusrpt-guard/fixtures
    request: >
      Adversarially review {{fixturesDir}}/report-defect-infra-notremoved.md against the
      source files in {{fixturesDir}}. Output your verdict and any findings.
  assert:
    - type: llm-rubric
      value: >
        The Infrastructure table still contains tf-provider PR 111, which was already Merged
        in a prior week (its status span is a plain green Merged with no **New**) and should
        have been removed this week. PASS only if the guard's verdict is FAIL AND a finding
        identifies that PR 111 (a prior-week-merged infra row) was not removed. FAIL if the
        guard misses it.
    - type: contains
      value: "FAIL"

# ─── Criterion 6: dropped row missing its reason → FAIL ───
- description: "G6 dropped-noreason — catch a Dropped row with an empty reason"
  metadata:
    skill: statusrpt-guard
    criterion: catch-dropped-noreason
  vars:
    skillFile: ../../skills/statusrpt-guard/SKILL.md
    fixturesDir: skills/statusrpt-guard/fixtures
    request: >
      Adversarially review {{fixturesDir}}/report-defect-dropped-noreason.md against the
      source files in {{fixturesDir}}. Output your verdict and any findings.
  assert:
    - type: llm-rubric
      value: >
        In this report, "Sample Session Store" is correctly in the Dropped table but its
        Reason cell is empty; a dropped row must cite why (the maintainer rejection). PASS
        only if the guard's verdict is FAIL AND a finding identifies the missing/empty reason
        on the dropped Sample Session Store row. FAIL if the guard misses it.
    - type: contains
      value: "FAIL"
