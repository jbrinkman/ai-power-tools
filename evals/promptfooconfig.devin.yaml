# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Devin-provider Promptfoo config for evaluating ai-power-tools skills.
# Identical to the Kiro config except for the provider/grader it runs through.
# Shared pieces (prompt shape, per-skill tests, defaults) are kept in sync with
# promptfooconfig.kiro.yaml; only the provider block differs.

description: ai-power-tools skills evaluation framework (Devin)

# The prompt loads the skill file and appends the user request.
prompts:
  - "@{{skillFile}}\n\n## User Request\n\n{{request}}"

# Default test vars and grader configuration used for all tests.
defaultTest:
  vars:
    skillFile: ../../skills/github-issue-creator/SKILL.md
    expectedRepo: test-org/test-repo
  options:
    provider: "exec: node ./providers/devin.js"
    config:
      model: "swe-1.6"

# Target provider that executes the skill.
providers:
  - id: "exec: node ./providers/devin.js"
    label: "Devin claude-sonnet-4.6"
    config:
      model: "claude-sonnet-4.6"

# Per-skill test files. Keep this list identical to promptfooconfig.kiro.yaml,
# EXCEPT taskei-issue-creator: that skill is MCP-backed and only certifiable
# under the Kiro provider's `taskei-mock` agent, so it is intentionally omitted
# here (Devin has no MCP-mock path).
tests:
  - file://skills/github-issue-creator/tests.yaml
  - file://skills/statusrpt-pr-tables/tests.yaml
  - file://skills/statusrpt-gather/tests.yaml
  - file://skills/statusrpt-compile/tests.yaml
  - file://skills/statusrpt-publish/tests.yaml
  - file://skills/pr-comment-resolver/tests.yaml

outputPath: results.html
