# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Master Promptfoo config for evaluating ai-power-tools skills.
# This config invokes each skill via Devin CLI's real skill-loading
# mechanism and runs per-skill test suites.

description: ai-power-tools skills evaluation framework

# "@skills:<name>" is Devin CLI's real skill-mention syntax -- it tells Devin
# to load that skill from disk itself (via the .agents/skills symlink; see
# evals/setup-skills-symlink.sh and evals/README.md), exactly as a real
# session would, rather than us splicing SKILL.md text into the prompt
# ourselves. Since this skill's SKILL.md/references files contain no
# $ARGUMENTS/$1 placeholders, {{request}} is appended after the skill's own
# content rather than substituted into it (see Devin CLI docs: "How Devin
# Uses Skills" -> "Mention a skill in your prompt"). Requires having run
# `task setup` (or evals/setup-skills-symlink.sh) at least once -- see
# evals/README.md.
prompts:
  - "@skills:{{skillName}} {{request}}"

# Default test vars and grader configuration used for all tests.
defaultTest:
  vars:
    skillName: github-issue-creator
    expectedRepo: test-org/test-repo
  options:
    provider: "exec: node ./providers/devin.js"
    config:
      model: "swe-1.6"

# Target provider that executes the skill.
providers:
  - id: "exec: node ./providers/devin.js"
    label: "Devin claude-sonnet-4.6"
    config:
      model: "claude-sonnet-4.6"

# Per-skill test files are imported here. Add new skills by adding their
# tests.yaml file below.
tests:
  - file://skills/github-issue-creator/tests.yaml

outputPath: results.html
