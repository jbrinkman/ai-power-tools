version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  eval:github-issue-creator:
    desc: 'Evaluate the github-issue-creator skill. Pass extra promptfoo flags after --, e.g. task eval:github-issue-creator -- --filter-metadata id=feature-request'
    cmds:
      - "npx promptfoo eval --no-cache --config promptfooconfig.yaml --filter-metadata skill=github-issue-creator --delay 0 {{.CLI_ARGS}}"

  eval:all:
    desc: 'Evaluate all skills. Pass extra promptfoo flags after --, e.g. task eval:all -- --filter-metadata id=feature-request'
    cmds:
      - "npx promptfoo eval --no-cache --config promptfooconfig.yaml --delay 0 {{.CLI_ARGS}}"

  view:
    desc: Open the Promptfoo dashboard with all evaluation history
    cmds:
      - "npx promptfoo view"

  view:last:
    desc: Open the latest evaluation results in the default browser
    cmds:
      - "open results.html"

  clean:
    desc: Remove evaluation artifacts and mock logs
    cmds:
      - "rm -rf tmp"
      - "rm -f results.html"
